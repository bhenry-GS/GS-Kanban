<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanban GS Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with board tabs; boards are horizontal lanes in their own scroller; other views are single-column lists. */
:root {
  --bg: #eceff3; --surface: #ffffff; --surface-2: #f5f7f9; --line: #d3d9e0; --line-strong: #b4bec9;
  --fg: #16202b; --muted: #5a6776; --accent: #1d5fb8; --accent-soft: #e2ecf9; --accent-ink: #ffffff;
  --pre: #0e7a72; --pre-soft: #ddf1ee; --post: #5a49c2; --post-soft: #ebe8fb;
  --bad: #bf3a2b; --bad-soft: #fbe6e3; --warn: #a86d12; --warn-soft: #fbf0dc; --good: #2b7d52; --good-soft: #e0f2e8;
  --shadow: 0 1px 2px rgba(22,32,43,.06), 0 2px 8px rgba(22,32,43,.05);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --surface-2: #1f2832; --line: #2c3743; --line-strong: #43505e;
  --fg: #e3e8ee; --muted: #93a0b0; --accent: #6ea4ef; --accent-soft: #1d2c40; --accent-ink: #0c1520;
  --pre: #43bfb3; --pre-soft: #163330; --post: #a094f3; --post-soft: #272444;
  --bad: #ef7b6e; --bad-soft: #3a201d; --warn: #e2ab4c; --warn-soft: #372b17; --good: #62c793; --good-soft: #17302a;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --surface-2: #1f2832; --line: #2c3743; --line-strong: #43505e;
  --fg: #e3e8ee; --muted: #93a0b0; --accent: #6ea4ef; --accent-soft: #1d2c40; --accent-ink: #0c1520;
  --pre: #43bfb3; --pre-soft: #163330; --post: #a094f3; --post-soft: #272444;
  --bad: #ef7b6e; --bad-soft: #3a201d; --warn: #e2ab4c; --warn-soft: #372b17; --good: #62c793; --good-soft: #17302a;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.topbar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px }
.brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 17px; white-space: nowrap }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; min-width: 0 }
.tab { border: 0; background: none; padding: 7px 11px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center }
.tab:hover { background: var(--surface-2); color: var(--fg) }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.tab .count { font-family: var(--f-mono); font-size: 11px; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; line-height: 17px }
.tab .count.zero { background: var(--line); color: var(--muted) }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px }
.who select { max-width: 190px }
.conn { font-family: var(--f-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line) }
.conn.live { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent) }
.conn.local { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent) }

main { padding-block: 18px 48px }
.view-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px }
.view-head h1 { font-size: 22px; font-weight: 700 }
.view-head .sub { color: var(--muted) }
.spacer { flex: 1 1 auto }

/* controls */
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.small { padding: 3px 8px; font-size: 12.5px }
.btn.ghost { border-color: transparent; background: none; color: var(--muted) }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2) }
.btn.danger { color: var(--bad) }
.btn.danger[data-armed] { background: var(--bad); color: #fff; border-color: var(--bad) }
input[type=text], input[type=date], input[type=number], select, textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 5px 8px; min-width: 0 }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500 }
label.field > input, label.field > select, label.field > textarea { color: var(--fg); font-size: 14px }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }

/* tags */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap }
.tag.pre { background: var(--pre-soft); color: var(--pre); border-color: transparent }
.tag.post { background: var(--post-soft); color: var(--post); border-color: transparent }
.due { font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums }
.due.soon { color: var(--warn); font-weight: 500 }
.due.late { color: var(--bad); font-weight: 500 }
.due.done { color: var(--muted); text-decoration: line-through }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; flex: none; font-family: var(--f-body) }
.avatar.none { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted) }

/* board */
.board-scroll { overflow-x: auto; padding-bottom: 8px; margin-inline: -4px; padding-inline: 4px }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 300px); gap: 12px; align-items: start }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 120px }
.col.drop { border-color: var(--accent); background: var(--accent-soft) }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line) }
.col-head h2 { font-size: 13.5px; font-weight: 600 }
.col-head .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted) }
.col-body { display: grid; gap: 8px; padding: 8px }
.col-empty { color: var(--muted); font-size: 12.5px; padding: 10px 6px; text-align: center }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px; box-shadow: var(--shadow); cursor: pointer; display: grid; gap: 7px; position: relative }
.card:hover { border-color: var(--line-strong) }
.card.dragging { opacity: .45 }
.card.sev-bad { border-left: 3px solid var(--bad) }
.card.sev-warn { border-left: 3px solid var(--warn) }
.card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.25 }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 12.5px }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden }
.progress > span { display: block; height: 100%; background: var(--good) }
.ctasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.ctasks li { display: grid; grid-template-columns: 14px 1fr auto auto; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0 }
.ctasks li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ctasks .more { color: var(--muted); font-size: 12px; grid-template-columns: 1fr }
.glyph { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; flex: none }
.glyph.doing { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%) }
.glyph.done { border-color: var(--good); background: var(--good) }
.glyph.blocked { border-style: dashed; border-color: var(--bad) }
.alert-line { font-size: 12px; color: var(--bad); display: flex; gap: 5px; align-items: baseline }
.alert-line.warn { color: var(--warn) }

/* lists */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.panel + .panel { margin-top: 14px }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 11px 14px; border-bottom: 1px solid var(--line) }
.panel-head h2 { font-size: 15px; font-weight: 600 }
.rows { list-style: none; margin: 0; padding: 0 }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line) }
.rows > .row:first-child { border-top: 0 }
.row .main { min-width: 0; display: grid; gap: 2px }
.row .title { font-weight: 500; overflow-wrap: anywhere }
.row .title.done { text-decoration: line-through; color: var(--muted) }
.row .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--muted); font-size: 12.5px }
.row .side { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font: inherit }
.link:hover { text-decoration: underline }
.status-btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 2px 9px 2px 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap }
.status-btn:hover { border-color: var(--accent) }
.status-btn.done { background: var(--good-soft); border-color: transparent; color: var(--good) }
.status-btn.doing { background: var(--accent-soft); border-color: transparent; color: var(--accent) }
.empty { padding: 26px 16px; text-align: center; color: var(--muted) }
.empty strong { display: block; color: var(--fg); font-family: var(--f-display); font-size: 15px; margin-bottom: 4px }
.group-label { padding: 8px 14px 6px; border-top: 1px solid var(--line); background: var(--surface-2); display: flex; gap: 8px; align-items: center }
.group-label.bad { color: var(--bad) }
.group-label.warn { color: var(--warn) }

.sev { width: 8px; align-self: stretch; border-radius: 4px; min-height: 28px }
.sev.bad { background: var(--bad) } .sev.warn { background: var(--warn) } .sev.info { background: var(--accent) }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(10,16,24,.45); z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto }
.modal { background: var(--surface); border-radius: 12px; width: min(1040px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,.25); border: 1px solid var(--line) }
.modal.narrow { width: min(520px, 100%) }
.modal-head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; padding: 16px 18px; border-bottom: 1px solid var(--line) }
.modal-head .grow { flex: 1 1 260px; min-width: 0; display: grid; gap: 8px }
.modal-head input.name { font-family: var(--f-display); font-size: 20px; font-weight: 700; border-color: transparent; padding: 2px 6px; margin-left: -6px; width: 100% }
.modal-head input.name:hover { border-color: var(--line) }
.modal-body { padding: 14px 18px 18px; display: grid; gap: 16px }
.fields { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end }
.fields > * { flex: 0 1 auto }
.form-grid { display: grid; gap: 12px; padding: 16px 18px }
.form-grid .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px 16px; border-top: 1px solid var(--line) }

.stage { border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.stage-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line) }
.stage-head h3 { font-size: 13px; font-weight: 600 }
.stage-head.current h3::after { content: "current"; font-family: var(--f-mono); font-size: 10px; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-left: 8px }
.trow { display: grid; grid-template-columns: 118px minmax(160px, 1fr) 150px 170px 140px auto; gap: 8px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--line) }
.trow:first-of-type { border-top: 0 }
.trow.zs { grid-template-columns: 24px minmax(160px, 1fr) 150px 170px 140px 150px }
.trow input[type=text] { width: 100% }
.trow select, .trow input[type=date] { width: 100% }
.trow .deps-note { grid-column: 2 / -1; font-size: 12px; color: var(--muted); margin-top: -3px }
.trow .deps-note.bad { color: var(--bad) }
details.deps { position: relative }
details.deps summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); white-space: nowrap }
details.deps summary::-webkit-details-marker { display: none }
details.deps[open] summary { border-color: var(--accent); color: var(--accent) }
.deps-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 3; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; width: 280px; max-height: 280px; overflow-y: auto; display: grid; gap: 2px }
.deps-pop label { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 3px 4px; border-radius: 4px; cursor: pointer }
.deps-pop label:hover { background: var(--surface-2) }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; padding: 9px 12px; border-top: 1px dashed var(--line); background: var(--surface-2) }
.addrow input[type=text] { flex: 1 1 200px }

/* templates */
.tpl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; padding: 12px 14px }
.tpl-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface) }
.tpl-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) }
.tpl-card h3 { font-size: 14px }
.srow { display: grid; grid-template-columns: 28px minmax(160px, 1fr) 160px 170px 92px auto auto; gap: 8px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line) }
.srow input[type=text] { width: 100% }
.srow .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right }
.srow-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--f-mono); border-top: 0 }
.colchips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px }
.colchip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 2px 2px 4px; background: var(--surface) }
.colchip input { border: 0; padding: 3px 4px; width: 150px }
.colchip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 5px; border-radius: 4px }
.colchip button:hover { background: var(--surface-2); color: var(--fg) }

/* automations */
.rule .switch { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer; min-width: 52px }
.rule .switch input:checked + span { color: var(--good) }
.rule.off .title { color: var(--muted) }
.rule-acts { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; color: var(--muted) }
.rule-acts b { color: var(--fg); font-weight: 700 }
.rule-when { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line) }
.rule-when input[type=text] { flex: 1 1 200px }
.arow { display: grid; grid-template-columns: minmax(160px, 1fr) 150px 190px 260px 160px auto; gap: 8px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--line) }
.arow input[type=text], .arow select { width: 100% }
.arow .due-cell { display: flex; gap: 4px; align-items: center }
.arow .due-cell input { width: 60px; flex: none }
.arow .due-cell select { flex: 1 1 auto; width: auto }
.arow-head { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-top: 0 }

.mrow { display: grid; grid-template-columns: minmax(140px, 1fr) 190px auto auto auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line) }
.checks { display: flex; gap: 10px; font-size: 12.5px }
.checks label { display: flex; gap: 4px; align-items: center }

.banner { margin-bottom: 14px; padding: 9px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 40; font-size: 13px; max-width: calc(100% - 32px) }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; align-items: center }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.hint { color: var(--muted); font-size: 12.5px }

@media (max-width: 760px) {
  .trow, .trow.zs { grid-template-columns: 1fr 1fr; }
  .trow > .title-cell { grid-column: 1 / -1; order: -1 }
  .trow .deps-note { grid-column: 1 / -1 }
  .srow { grid-template-columns: 28px 1fr 1fr; }
  .srow > .title-cell { grid-column: 2 / -1 }
  .srow-head { display: none }
  .mrow { grid-template-columns: 1fr 1fr }
  .arow { grid-template-columns: 1fr 1fr }
  .arow > .title-cell, .arow > .due-cell { grid-column: 1 / -1 }
  .arow-head { display: none }
  .row { grid-template-columns: auto minmax(0, 1fr) }
  .row .side { grid-column: 2; justify-content: flex-start }
  .row > .status-btn { align-self: start }
  .form-grid .two { grid-template-columns: 1fr }
  .who select { max-width: 150px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
"use strict";

/* ---------- constants ---------- */
const BOARDS = ["pre", "post"];
const BOARD_NAME = { pre: "Pre sales", post: "Post sales" };
const ROLES = {
  pre: ["Sales", "Engineering"],
  post: ["PM", "Engineering", "Billing", "Shipping & Receiving", "Programming", "Drafting"],
};
const ALL_ROLES = ["Sales", "PM", "Engineering", "Billing", "Shipping & Receiving", "Programming", "Drafting"];
const DEFAULT_COLUMNS = {
  pre: ["Lead", "Qualify", "Engineering review", "Quote", "Negotiation", "Won / Lost"],
  post: ["Kickoff", "Design & Drafting", "Programming", "Procurement & Build", "Ship & Install", "Billing & Closeout", "Complete"],
};
const SOON_DAYS = 3;      // a task due within this many days counts as "due soon"
const WEEK_DAYS = 7;
const STATUS_NEXT = { todo: "doing", doing: "done", done: "todo" };
const STATUS_LABEL = { todo: "To do", doing: "In progress", done: "Done" };
const COLLECTIONS = ["members", "projects", "tasks", "templates", "config", "automations"];

/* ---------- state ---------- */
const S = {
  members: {}, projects: {}, tasks: {}, templates: {}, config: {}, automations: {},
  loaded: {}, mode: "connecting",
  view: "pre", me: null, personView: null, showDone: false,
  modal: null, tplEdit: null, autoEdit: null, alertBoard: "all", zoom: null, host: null,
};
let db = null, userApi = null, myUserId = null;

const LS = {
  get(k) { try { return localStorage.getItem("gskanban:" + k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem("gskanban:" + k) : localStorage.setItem("gskanban:" + k, v); } catch (e) {} },
};

/* ---------- helpers ---------- */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysFromToday(s) { const a = parseYmd(today()), b = parseYmd(s); return Math.round((b - a) / 86400000); }
function fmtDate(s) { return parseYmd(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function relDays(n) { return n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "1 day late" : n < 0 ? (-n) + " days late" : "in " + n + " days"; }

function dueChip(due, done) {
  if (!due) return '<span class="due">no date</span>';
  const n = daysFromToday(due);
  const cls = done ? "done" : n < 0 ? "late" : n <= SOON_DAYS ? "soon" : "";
  const extra = done ? "" : " · " + relDays(n);
  return '<span class="due ' + cls + '" title="' + esc(due) + '">' + esc(fmtDate(due)) + esc(extra) + "</span>";
}
function hue(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join(""); }
function avatar(memberId) {
  const m = S.members[memberId];
  if (!m) return '<span class="avatar none" title="Unassigned">?</span>';
  return '<span class="avatar" style="background:hsl(' + hue(m.id) + ' 45% 42%)" title="' + esc(m.name + " · " + m.role) + '">' + esc(initials(m.name)) + "</span>";
}
const memberName = (id) => (S.members[id] ? S.members[id].name : "Unassigned");
const boardTag = (b) => '<span class="tag ' + b + '">' + esc(BOARD_NAME[b] || b) + "</span>";
const columnsFor = (b) => (S.config.boards && Array.isArray(S.config.boards[b]) && S.config.boards[b].length ? S.config.boards[b] : DEFAULT_COLUMNS[b]);
const sortedMembers = () => Object.values(S.members).sort((a, b) => a.name.localeCompare(b.name));
const activeProjects = () => Object.values(S.projects).filter((p) => !p.archived);
const tasksOf = (pid) => Object.values(S.tasks).filter((t) => t.projectId === pid).sort(taskOrder);
function taskOrder(a, b) { return (a.order ?? 0) - (b.order ?? 0) || (a.due || "9999").localeCompare(b.due || "9999"); }
function byDue(a, b) { return (a.due || "9999-99-99").localeCompare(b.due || "9999-99-99") || a.title.localeCompare(b.title); }
function openDeps(t) { return (t.dependsOn || []).map((id) => S.tasks[id]).filter((d) => d && d.status !== "done"); }

/* ---------- store ---------- */
// Same surface as the claude.ai page store, backed by this app's own server.
function restDb() {
  const listeners = {};
  let docs = null;
  const fire = (c) => (listeners[c] || []).forEach((fn) => fn({ docs: Object.entries(docs[c] || {}).map(([id, d]) => ({ id, data: () => d })) }));
  const send = (method, c, id, body) => fetch("api/" + c + "/" + encodeURIComponent(id), {
    method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined,
  }).then((r) => { if (!r.ok) throw { code: r.status === 404 || r.status === 400 ? "invalid_argument" : "unavailable" }; });
  const load = () => fetch("api/all").then((r) => r.json()).then((all) => { docs = all; Object.keys(listeners).forEach(fire); });
  const es = new EventSource("api/stream");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (!docs) return;
    docs[ev.col] = Object.assign({}, docs[ev.col]);
    if (ev.data) docs[ev.col][ev.id] = ev.data; else delete docs[ev.col][ev.id];
    fire(ev.col);
  };
  es.onopen = () => load();   // reload on every (re)connect so nothing missed while offline is lost
  return {
    collection: (c) => ({
      onSnapshot(next) { (listeners[c] = listeners[c] || []).push(next); if (docs) fire(c); return () => {}; },
      doc: (id) => ({ set: (d) => send("PUT", c, id, d), update: (d) => send("PATCH", c, id, d), delete: () => send("DELETE", c, id) }),
    }),
  };
}
const queues = {};
function write(col, id, data, kind) {
  kind = kind || "set";
  const prev = S[col][id];
  if (kind === "delete") delete S[col][id];
  else if (kind === "update") S[col][id] = Object.assign({}, prev, data, { id });
  else S[col][id] = Object.assign({}, data, { id });
  schedule();
  if (!db) return Promise.resolve();
  const path = col + "/" + id;
  const body = clone(data || {}); delete body.id;
  const run = () => {
    const ref = db.collection(col).doc(id);
    return kind === "delete" ? ref.delete() : kind === "update" ? ref.update(body) : ref.set(body);
  };
  queues[path] = (queues[path] || Promise.resolve()).then(run).catch((e) => {
    const code = e && e.code;
    toast(code === "invalid_argument" ? "You don't have permission to change this board." : code === "quota_exceeded" ? "The board's storage is full. Archive or delete old projects." : "Couldn't save that change. Check your connection and try again.");
  });
  return queues[path];
}

async function connect() {
  try {
    const h = await fetch("api/health").then((r) => (r.ok ? r.json() : null));
    if (h && h.ok) { S.host = "server"; db = restDb(); return subscribeAll(); }
  } catch (e) {}
  S.host = "claude";
  let tries = 0;
  while (!(window.claude && window.claude.use) && tries < 20) { await new Promise((r) => setTimeout(r, 100)); tries++; }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { S.mode = "local"; COLLECTIONS.forEach((c) => (S.loaded[c] = true)); pickMe(); render(); return; }
  subscribeAll();
  try { userApi = await window.claude.use("user"); myUserId = userApi ? await userApi.id() : null; } catch (e) {}
  pickMe(); schedule();
}

function subscribeAll() {
  S.mode = "live";
  COLLECTIONS.forEach((c) => {
    db.collection(c).onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); });
      S[c] = m; S.loaded[c] = true;
      if (c === "members") pickMe();
      schedule();
    }, (e) => { S.mode = "error"; toast("Lost the live connection. Reload the page to reconnect."); schedule(); });
  });
}

function pickMe() {
  const saved = LS.get("me");
  if (saved && S.members[saved]) { S.me = saved; return; }
  if (myUserId) {
    const m = Object.values(S.members).find((x) => x.userId === myUserId);
    if (m) { S.me = m.id; LS.set("me", m.id); return; }
  }
  if (S.me && !S.members[S.me]) S.me = null;
}

/* ---------- alerts ---------- */
function computeAlerts() {
  const out = [];
  const live = new Set(activeProjects().map((p) => p.id));
  for (const t of Object.values(S.tasks)) {
    if (t.status === "done" || !live.has(t.projectId)) continue;
    const p = S.projects[t.projectId];
    const n = t.due ? daysFromToday(t.due) : null;
    const deps = openDeps(t);
    if (n !== null && n < 0) out.push({ sev: "bad", kind: "Overdue", task: t, project: p, text: t.title + " is " + relDays(n) });
    else if (n !== null && n <= SOON_DAYS && deps.length === 0) out.push({ sev: "warn", kind: "Due soon", task: t, project: p, text: t.title + " is due " + relDays(n) });
    if (deps.length && n !== null && n <= WEEK_DAYS) {
      for (const d of deps) {
        out.push({
          sev: n <= SOON_DAYS ? "bad" : "warn", kind: "Prerequisite not done", task: t, project: p, dep: d,
          text: d.title + " (" + (d.role || "no role") + ", " + memberName(d.assigneeId) + ") must finish before " + t.title + ", which is due " + relDays(n),
        });
      }
    }
    if (!t.assigneeId && n !== null && n <= WEEK_DAYS) out.push({ sev: "warn", kind: "Unassigned", task: t, project: p, text: t.title + " has no one assigned and is due " + relDays(n) });
  }
  for (const p of activeProjects()) {
    if (!p.due) continue;
    const n = daysFromToday(p.due);
    const open = tasksOf(p.id).filter((t) => t.status !== "done").length;
    if (open && n <= WEEK_DAYS) out.push({ sev: n < 0 ? "bad" : "warn", kind: "Project deadline", project: p, text: p.name + " is due " + relDays(n) + " with " + open + " open task" + (open === 1 ? "" : "s") });
  }
  const rank = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev] || ((a.task && a.task.due) || (a.project && a.project.due) || "9").localeCompare((b.task && b.task.due) || (b.project && b.project.due) || "9"));
}
function projectSeverity(pid, alerts) {
  let s = null;
  for (const a of alerts) if (a.project && a.project.id === pid) { if (a.sev === "bad") return "bad"; s = "warn"; }
  return s;
}

/* ---------- render ---------- */
let rafPending = false, deferred = false;
function schedule() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}
function typing() {
  const a = document.activeElement;
  if (!a || !document.getElementById("app").parentNode.contains(a)) return false;
  if (a.tagName === "TEXTAREA") return true;
  return a.tagName === "INPUT" && /^(text|number|search)$/.test(a.type);
}
document.addEventListener("focusout", () => { if (deferred) setTimeout(() => { if (!typing()) { deferred = false; render(); } }, 0); });

function render() {
  if (typing()) { deferred = true; return; }
  const keep = {};
  document.querySelectorAll("[data-keep-scroll]").forEach((el) => (keep[el.dataset.keepScroll] = [el.scrollLeft, el.scrollTop]));
  const openDetails = Array.from(document.querySelectorAll("details[data-key][open]")).map((d) => d.dataset.key);
  const alerts = computeAlerts();
  document.getElementById("app").innerHTML = renderTop(alerts) + '<main class="wrap">' + renderBanner() + renderView(alerts) + "</main>";
  document.getElementById("modal-root").innerHTML = renderModal();
  document.querySelectorAll("[data-keep-scroll]").forEach((el) => { const k = keep[el.dataset.keepScroll]; if (k) { el.scrollLeft = k[0]; el.scrollTop = k[1]; } });
  openDetails.forEach((k) => { const d = document.querySelector('details[data-key="' + k + '"]'); if (d) d.open = true; });
}

function renderTop(alerts) {
  const bad = alerts.filter((a) => a.sev === "bad").length;
  const mine = S.me ? Object.values(S.tasks).filter((t) => t.assigneeId === S.me && t.status !== "done" && S.projects[t.projectId] && !S.projects[t.projectId].archived).length : 0;
  const tab = (v, label, extra) => '<button class="tab" data-action="view" data-view="' + v + '"' + (S.view === v ? ' aria-current="page"' : "") + ">" + label + (extra || "") + "</button>";
  const meOpts = '<option value="">Choose…</option>' + sortedMembers().map((m) => '<option value="' + esc(m.id) + '"' + (m.id === S.me ? " selected" : "") + ">" + esc(m.name) + "</option>").join("");
  const conn = S.mode === "live" ? '<span class="conn live" title="Changes save for the whole team">Live</span>' : S.mode === "local" ? '<span class="conn local" title="Changes are not saved">Preview only</span>' : S.mode === "error" ? '<span class="conn local">Offline</span>' : '<span class="conn">Connecting</span>';
  return '<header class="topbar"><div class="topbar-inner wrap">' +
    '<div class="brand">Kanban <small>GS edition</small></div>' +
    '<nav class="tabs" aria-label="Views">' +
      tab("pre", "Pre sales") + tab("post", "Post sales") +
      tab("mine", "My tasks", mine ? ' <span class="count zero">' + mine + "</span>" : "") +
      tab("alerts", "Alerts", ' <span class="count' + (bad ? "" : " zero") + '">' + alerts.length + "</span>") +
      tab("templates", "Templates") + tab("automations", "Automations") + tab("team", "Team") +
    "</nav>" +
    '<div class="who"><label for="me-select">Viewing as</label><select id="me-select" data-action="set-me">' + meOpts + "</select>" + conn + "</div>" +
  "</div></header>";
}

function renderBanner() {
  if (S.mode === "local") return '<div class="banner">This preview isn\'t connected to the team\'s shared board, so changes here are not saved. Open the published page to work with live data.</div>';
  return "";
}

function renderView(alerts) {
  const loading = COLLECTIONS.some((c) => !S.loaded[c]);
  if (loading) return '<div class="empty"><strong>Loading the board…</strong>Projects, tasks and templates are on their way.</div>';
  switch (S.view) {
    case "pre": case "post": return renderBoard(S.view, alerts);
    case "mine": return renderMine();
    case "alerts": return renderAlerts(alerts);
    case "templates": return renderTemplates();
    case "automations": return renderAutomations();
    case "team": return renderTeam();
  }
  return "";
}

/* board */
function renderBoard(b, alerts) {
  const cols = columnsFor(b);
  const projects = activeProjects().filter((p) => p.board === b);
  const byCol = {}; cols.forEach((c) => (byCol[c] = []));
  projects.forEach((p) => { (byCol[p.column] || byCol[cols[0]]).push(p); });
  Object.values(byCol).forEach((arr) => arr.sort((a, b2) => (a.due || "9").localeCompare(b2.due || "9")));
  const head = '<div class="view-head"><h1>' + BOARD_NAME[b] + '</h1><span class="sub">' + projects.length + " active project" + (projects.length === 1 ? "" : "s") + " · " + ROLES[b].join(", ") + '</span><span class="spacer"></span>' +
    '<div class="legend"><span><i class="glyph"></i>To do</span><span><i class="glyph doing"></i>In progress</span><span><i class="glyph blocked"></i>Waiting on a prerequisite</span></div>' +
    '<button class="btn primary" data-action="new-project" data-board="' + b + '">New project</button></div>';
  const colHtml = cols.map((c) => {
    const ps = byCol[c];
    return '<section class="col" data-drop-col="' + esc(c) + '"><div class="col-head"><h2>' + esc(c) + '</h2><span class="n">' + ps.length + "</span></div>" +
      '<div class="col-body">' + (ps.length ? ps.map((p) => renderCard(p, alerts)).join("") : '<div class="col-empty">Drag a project here</div>') + "</div></section>";
  }).join("");
  const empty = projects.length ? "" : '<div class="empty" style="margin-bottom:12px"><strong>No ' + BOARD_NAME[b].toLowerCase() + ' projects yet</strong>Start one with New project. It picks up the tasks from a pathway template, which you can change under Templates.</div>';
  return head + empty + '<div class="board-scroll" data-keep-scroll="board-' + b + '"><div class="board">' + colHtml + "</div></div>";
}

function renderCard(p, alerts) {
  const ts = tasksOf(p.id);
  const done = ts.filter((t) => t.status === "done").length;
  const pct = ts.length ? Math.round((done / ts.length) * 100) : 0;
  const open = ts.filter((t) => t.status !== "done");
  // tasks that can be worked right now: in progress first, then ready (no open prerequisites)
  const active = open.filter((t) => t.status === "doing" || openDeps(t).length === 0).sort((a, b) => (a.status === "doing" ? -1 : 0) - (b.status === "doing" ? -1 : 0) || byDue(a, b));
  const shown = active.slice(0, 4);
  const sev = projectSeverity(p.id, alerts);
  const pAlerts = alerts.filter((a) => a.project && a.project.id === p.id);
  return '<article class="card' + (sev ? " sev-" + sev : "") + '" draggable="true" data-drag-project="' + esc(p.id) + '" data-action="open-project" data-id="' + esc(p.id) + '" tabindex="0" aria-label="Open ' + esc(p.name) + '">' +
    "<h3>" + esc(p.name) + "</h3>" +
    '<div class="card-meta">' + (p.number ? '<span class="due">' + esc(p.number) + "</span>" : "") + (p.client ? "<span>" + esc(p.client) + "</span>" : "") + (p.due ? dueChip(p.due, false) : "") + "</div>" +
    (ts.length ? '<div class="progress" title="' + done + " of " + ts.length + ' tasks done"><span style="width:' + pct + '%"></span></div>' : "") +
    (shown.length ? '<ul class="ctasks">' + shown.map((t) => '<li><i class="glyph ' + (t.status === "doing" ? "doing" : "") + '"></i><span class="t" title="' + esc(t.title) + '">' + esc(t.title) + "</span>" + (t.due ? dueChip(t.due, false).replace(/ · .*?</, "<") : "<span></span>") + avatar(t.assigneeId) + "</li>").join("") +
      (active.length > shown.length ? '<li class="more">+' + (active.length - shown.length) + " more ready</li>" : "") + "</ul>"
      : ts.length && !open.length ? '<div class="hint">All tasks done</div>' : !ts.length ? '<div class="hint">No tasks yet</div>' : '<div class="hint">Waiting on prerequisites</div>') +
    (pAlerts.length ? '<div class="alert-line' + (sev === "bad" ? "" : " warn") + '">' + pAlerts.length + " alert" + (pAlerts.length === 1 ? "" : "s") + ": " + esc(pAlerts[0].kind.toLowerCase()) + "</div>" : "") +
    '<div class="card-meta"><span>' + done + "/" + ts.length + " done</span></div>" +
  "</article>";
}

/* personal list */
function taskRow(t, opts) {
  opts = opts || {};
  const p = S.projects[t.projectId];
  const deps = openDeps(t);
  const st = t.status || "todo";
  return '<li class="row">' +
    '<button class="status-btn ' + st + '" data-action="cycle-status" data-id="' + esc(t.id) + '" title="Change status"><i class="glyph ' + (st === "todo" && deps.length ? "blocked" : st) + '"></i>' + STATUS_LABEL[st] + "</button>" +
    '<div class="main"><div class="title' + (st === "done" ? " done" : "") + '">' + esc(t.title) + "</div>" +
      '<div class="meta">' + (p ? '<button class="link" data-action="open-project" data-id="' + esc(p.id) + '">' + esc(p.name) + "</button>" + boardTag(p.board) : "") + (t.role ? '<span class="tag">' + esc(t.role) + "</span>" : "") + (t.source === "automation" ? '<span class="tag" title="' + esc(t.sourceNote || "Added by an automation") + '">Auto</span>' : "") +
      (opts.showAssignee ? "<span>" + esc(memberName(t.assigneeId)) + "</span>" : "") +
      (deps.length && st !== "done" ? '<span style="color:var(--bad)">Waiting on ' + deps.map((d) => esc(d.title) + " (" + esc(memberName(d.assigneeId)) + ")").join(", ") + "</span>" : "") + "</div></div>" +
    '<div class="side">' + dueChip(t.due, st === "done") + (opts.claim ? '<button class="btn small" data-action="claim" data-id="' + esc(t.id) + '">Take it</button>' : "") + "</div>" +
  "</li>";
}

function renderMine() {
  const who = S.personView || S.me;
  const members = sortedMembers();
  const pick = '<select id="person-select" data-action="person-view"><option value="">Choose a person…</option>' + members.map((m) => '<option value="' + esc(m.id) + '"' + (m.id === who ? " selected" : "") + ">" + esc(m.name) + (m.id === S.me ? " (you)" : "") + "</option>").join("") + "</select>";
  const head = '<div class="view-head"><h1>' + (who && who !== S.me ? esc(memberName(who)) + "'s tasks" : "My tasks") + '</h1><span class="sub">Sorted by due date</span><span class="spacer"></span>' + pick +
    '<label class="checks"><label><input type="checkbox" id="show-done" data-action="toggle-done"' + (S.showDone ? " checked" : "") + "> Show done</label></label></div>";
  if (!members.length) return head + '<div class="panel"><div class="empty"><strong>Add your team first</strong>Personal lists appear once people are added under Team and tasks are assigned to them.</div></div>';
  if (!who) return head + '<div class="panel"><div class="empty"><strong>Who are you?</strong>Pick your name in "Viewing as" at the top. This browser remembers it.</div></div>';
  const live = (t) => S.projects[t.projectId] && !S.projects[t.projectId].archived;
  const all = Object.values(S.tasks).filter((t) => t.assigneeId === who && live(t) && (S.showDone || t.status !== "done")).sort(byDue);
  const groups = [
    ["bad", "Overdue", (t) => t.status !== "done" && t.due && daysFromToday(t.due) < 0],
    ["warn", "Due in the next 7 days", (t) => t.status !== "done" && t.due && daysFromToday(t.due) >= 0 && daysFromToday(t.due) <= WEEK_DAYS],
    ["", "Later", (t) => t.status !== "done" && t.due && daysFromToday(t.due) > WEEK_DAYS],
    ["", "No due date", (t) => t.status !== "done" && !t.due],
    ["", "Done", (t) => t.status === "done"],
  ];
  let body = "";
  for (const [cls, label, fn] of groups) {
    const ts = all.filter(fn);
    if (!ts.length) continue;
    body += '<div class="group-label ' + cls + '"><span class="eyebrow" style="color:inherit">' + label + '</span><span class="due">' + ts.length + "</span></div><ul class=\"rows\">" + ts.map((t) => taskRow(t)).join("") + "</ul>";
  }
  const m = S.members[who];
  const unclaimed = m ? Object.values(S.tasks).filter((t) => !t.assigneeId && t.role === m.role && t.status !== "done" && live(t) && (m.boards || BOARDS).includes(S.projects[t.projectId].board)).sort(byDue) : [];
  return head +
    '<div class="panel"><div class="panel-head"><h2>Assigned</h2><span class="hint">' + all.filter((t) => t.status !== "done").length + " open</span></div>" +
      (body || '<div class="empty"><strong>Nothing assigned right now</strong>Tasks assigned on either board show up here, soonest first.</div>') + "</div>" +
    (m ? '<div class="panel"><div class="panel-head"><h2>Open ' + esc(m.role) + ' tasks with no one assigned</h2><span class="hint">' + unclaimed.length + "</span></div>" +
      (unclaimed.length ? '<ul class="rows">' + unclaimed.map((t) => taskRow(t, { claim: true })).join("") + "</ul>" : '<div class="empty">Every ' + esc(m.role) + " task has an owner.</div>") + "</div>" : "");
}

/* alerts */
function renderAlerts(alerts) {
  const list = S.alertBoard === "all" ? alerts : alerts.filter((a) => a.project && a.project.board === S.alertBoard);
  const filt = '<select id="alert-board" data-action="alert-board"><option value="all">Both boards</option>' + BOARDS.map((b) => '<option value="' + b + '"' + (S.alertBoard === b ? " selected" : "") + ">" + BOARD_NAME[b] + "</option>").join("") + "</select>";
  const head = '<div class="view-head"><h1>Alerts</h1><span class="sub">Overdue work, prerequisites that must finish first, and deadlines inside ' + WEEK_DAYS + ' days</span><span class="spacer"></span>' + filt + "</div>";
  if (!list.length) return head + '<div class="panel"><div class="empty"><strong>Nothing needs attention</strong>Alerts appear when a task is late, a prerequisite isn\'t done ahead of a due date, or work due this week has no owner.</div></div>';
  return head + '<div class="panel"><ul class="rows">' + list.map((a) =>
    '<li class="row"><span class="sev ' + a.sev + '"></span><div class="main"><div class="eyebrow" style="color:var(--' + (a.sev === "bad" ? "bad" : "warn") + ')">' + esc(a.kind) + '</div><div class="title">' + esc(a.text) + "</div>" +
      '<div class="meta"><button class="link" data-action="open-project" data-id="' + esc(a.project.id) + '">' + esc(a.project.name) + "</button>" + boardTag(a.project.board) +
      (a.task ? "<span>Assigned to " + esc(memberName(a.task.assigneeId)) + "</span>" : "") + "</div></div>" +
      '<div class="side">' + (a.task ? dueChip(a.task.due, false) : dueChip(a.project.due, false)) + "</div></li>").join("") + "</ul></div>";
}

/* templates */
function renderTemplates() {
  const head = '<div class="view-head"><h1>Templates</h1><span class="sub">Normal pathways that new projects start from. Changing a template doesn\'t touch existing projects.</span></div>';
  let html = head;
  for (const b of BOARDS) {
    const tpls = Object.values(S.templates).filter((t) => t.board === b).sort((x, y) => x.name.localeCompare(y.name));
    html += '<div class="panel"><div class="panel-head"><h2>' + BOARD_NAME[b] + '</h2><span class="spacer"></span><button class="btn small" data-action="new-template" data-board="' + b + '">New template</button></div>' +
      '<div class="panel-head" style="border-bottom:0;padding-bottom:0"><span class="eyebrow">Board columns</span><span class="hint">Rename, reorder, or add the main stages for this board</span></div>' +
      '<div class="colchips">' + columnsFor(b).map((c, i, arr) => '<span class="colchip"><input type="text" aria-label="Column name" data-action="col-rename" data-board="' + b + '" data-i="' + i + '" value="' + esc(c) + '">' +
        '<button title="Move left" data-action="col-move" data-board="' + b + '" data-i="' + i + '" data-d="-1"' + (i === 0 ? " disabled" : "") + ">←</button>" +
        '<button title="Move right" data-action="col-move" data-board="' + b + '" data-i="' + i + '" data-d="1"' + (i === arr.length - 1 ? " disabled" : "") + ">→</button>" +
        '<button title="Remove column" data-action="col-remove" data-board="' + b + '" data-i="' + i + '">×</button></span>').join("") +
        '<button class="btn small" data-action="col-add" data-board="' + b + '">Add column</button></div>' +
      (tpls.length ? '<div class="tpl-list">' + tpls.map((t) => '<div class="tpl-card' + (S.tplEdit && S.tplEdit.id === t.id ? " active" : "") + '"><h3>' + esc(t.name) + '</h3><span class="hint">' + (t.steps || []).length + " steps · " +
        Array.from(new Set((t.steps || []).map((s) => s.role))).length + ' roles</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-action="edit-template" data-id="' + esc(t.id) + '">Edit</button><button class="btn small ghost" data-action="dup-template" data-id="' + esc(t.id) + '">Duplicate</button></div></div>').join("") + "</div>"
        : '<div class="empty">No templates for this board yet. New template starts an empty pathway.</div>') +
      (S.tplEdit && S.tplEdit.draft.board === b ? renderTplEditor() : "") + "</div>";
  }
  return html;
}

function renderTplEditor() {
  const d = S.tplEdit.draft;
  const cols = columnsFor(d.board);
  const roles = ROLES[d.board];
  const steps = d.steps;
  const rows = steps.map((s, i) => {
    const others = steps.filter((o) => o.key !== s.key);
    const depCount = (s.dependsOn || []).length;
    return '<div class="srow"><span class="num">' + (i + 1) + "</span>" +
      '<div class="title-cell"><input type="text" aria-label="Step title" data-action="step-field" data-k="title" data-i="' + i + '" value="' + esc(s.title) + '"></div>' +
      '<select aria-label="Role" data-action="step-field" data-k="role" data-i="' + i + '">' + roles.concat(roles.includes(s.role) ? [] : [s.role]).map((r) => "<option" + (r === s.role ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>" +
      '<select aria-label="Stage" data-action="step-field" data-k="stage" data-i="' + i + '">' + cols.concat(cols.includes(s.stage) ? [] : [s.stage]).map((c) => "<option" + (c === s.stage ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select>" +
      '<label title="Days before the project due date" style="display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)"><input type="number" min="0" style="width:56px" aria-label="Days before due" data-action="step-field" data-k="offsetDays" data-i="' + i + '" value="' + esc(s.offsetDays) + '">d</label>' +
      '<details class="deps" data-key="sdep-' + esc(s.key) + '"><summary>' + (depCount ? "After " + depCount : "No prereqs") + '</summary><div class="deps-pop">' +
        (others.length ? others.map((o) => '<label><input type="checkbox" data-action="step-dep" data-i="' + i + '" data-key="' + esc(o.key) + '"' + ((s.dependsOn || []).includes(o.key) ? " checked" : "") + "> " + esc(o.title || "Untitled") + "</label>").join("") : '<span class="hint">Add more steps first</span>') +
      "</div></details>" +
      '<span style="display:flex;gap:2px"><button class="btn small ghost" title="Move up" data-action="step-move" data-i="' + i + '" data-d="-1"' + (i === 0 ? " disabled" : "") + '>↑</button><button class="btn small ghost" title="Move down" data-action="step-move" data-i="' + i + '" data-d="1"' + (i === steps.length - 1 ? " disabled" : "") + '>↓</button><button class="btn small ghost" title="Remove step" data-action="step-remove" data-i="' + i + '">×</button></span>' +
    "</div>";
  }).join("");
  return '<div style="border-top:1px solid var(--line)"><div class="panel-head" style="background:var(--accent-soft)">' +
      '<label class="field" style="flex:1 1 240px">Template name<input type="text" id="tpl-name" data-action="tpl-name" value="' + esc(d.name) + '"></label>' +
      '<span class="spacer"></span>' + (S.tplEdit.dirty ? '<span class="hint">Unsaved changes</span>' : "") +
      '<button class="btn danger small" data-action="del-template">Delete template</button><button class="btn small" data-action="cancel-template">Close</button><button class="btn primary small" data-action="save-template">Save template</button></div>' +
      '<div class="srow srow-head"><span>#</span><span>Step</span><span>Role</span><span>Stage</span><span>Lead time</span><span>Prerequisites</span><span></span></div>' +
      rows +
      '<div class="addrow"><button class="btn small" data-action="step-add">Add step</button><span class="hint">Lead time is how many days before the project due date the step should be finished.</span></div></div>';
}

/* automations */
function renderAutomations() {
  const head = '<div class="view-head"><h1>Automations</h1><span class="sub">Add tasks on their own when a project moves to a column or a task is finished. Rules only add tasks; they never change or remove anything.</span></div>';
  let html = head;
  for (const b of BOARDS) {
    const rules = Object.values(S.automations).filter((r) => r.board === b).sort((x, y) => (x.createdAt || "").localeCompare(y.createdAt || ""));
    html += '<div class="panel"><div class="panel-head"><h2>' + BOARD_NAME[b] + '</h2><span class="hint">' + rules.length + " rule" + (rules.length === 1 ? "" : "s") + '</span><span class="spacer"></span><button class="btn small" data-action="new-rule" data-board="' + b + '">New rule</button></div>' +
      (rules.length ? '<ul class="rows">' + rules.map(ruleRow).join("") + "</ul>"
        : '<div class="empty">No rules for this board yet. For example: when a project moves into ' + esc(columnsFor(b)[1] || columnsFor(b)[0]) + ", add a task for the least busy " + esc(ROLES[b][ROLES[b].length > 1 ? 1 : 0]) + " person, due in 2 days.</div>") +
      (S.autoEdit && S.autoEdit.draft.board === b ? renderRuleEditor() : "") + "</div>";
  }
  return html;
}

function ruleRow(r) {
  const on = r.enabled !== false;
  const tr = r.trigger || {};
  const stale = tr.type === "column" && !columnsFor(r.board).includes(tr.column);
  return '<li class="row rule' + (on ? "" : " off") + '">' +
    '<label class="switch" title="Turn this rule on or off"><input type="checkbox" data-action="rule-toggle" data-id="' + esc(r.id) + '"' + (on ? " checked" : "") + "><span>" + (on ? "On" : "Off") + "</span></label>" +
    '<div class="main"><div class="title">' + esc(ruleSummary(r)) + "</div>" +
      '<ul class="rule-acts">' + (r.actions || []).map((a) => "<li>Add <b>" + esc(a.title) + "</b> for " + esc(assignLabel(a)) + ", " + esc(dueLabel(a)) + "</li>").join("") + "</ul>" +
      (stale ? '<div class="deps-note bad" style="margin:0">The ' + esc(tr.column) + " column no longer exists, so this rule won't run.</div>" : "") + "</div>" +
    '<div class="side"><button class="btn small" data-action="edit-rule" data-id="' + esc(r.id) + '">Edit</button></div></li>';
}

function renderRuleEditor() {
  const d = S.autoEdit.draft, b = d.board, tr = d.trigger;
  const cols = columnsFor(b), roles = ROLES[b];
  const members = sortedMembers().filter((m) => (m.boards || BOARDS).includes(b));
  const opt = (v, label, cur) => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + ">" + esc(label) + "</option>";
  const when = '<div class="rule-when"><span class="eyebrow">When</span>' +
    '<select aria-label="Trigger" data-action="rule-trig" data-k="type">' + opt("column", "a project moves into", tr.type) + opt("task", "a task is completed", tr.type) + "</select>" +
    (tr.type === "column"
      ? '<select aria-label="Column" data-action="rule-trig" data-k="column">' + cols.concat(cols.includes(tr.column) || !tr.column ? [] : [tr.column]).map((c) => opt(c, c, tr.column)).join("") + "</select>"
      : '<input type="text" aria-label="Task name contains" placeholder="Task name contains, e.g. Site survey" data-action="rule-trig" data-k="match" value="' + esc(tr.match || "") + '">' +
        '<select aria-label="Task role" data-action="rule-trig" data-k="role">' + opt("", "Any role", tr.role || "") + roles.map((r) => opt(r, r, tr.role)).join("") + "</select>") +
    "</div>";
  const rows = d.actions.map((a, i) => {
    const assign = '<select aria-label="Assign to" data-action="rule-act" data-k="assign" data-i="' + i + '">' + opt(ASSIGN_ROLE, "Least busy " + a.role, a.assign) + opt("", "Unassigned", a.assign) +
      '<optgroup label="Person">' + members.map((m) => opt(m.id, m.name + (m.role !== a.role ? " · " + m.role : ""), a.assign)).join("") +
      (a.assign && a.assign !== ASSIGN_ROLE && !members.find((m) => m.id === a.assign) ? opt(a.assign, memberName(a.assign), a.assign) : "") + "</optgroup></select>";
    return '<div class="arow">' +
      '<div class="title-cell"><input type="text" aria-label="Task to add" placeholder="Task to add" data-action="rule-act" data-k="title" data-i="' + i + '" value="' + esc(a.title) + '"></div>' +
      '<select aria-label="Role" data-action="rule-act" data-k="role" data-i="' + i + '">' + roles.concat(roles.includes(a.role) ? [] : [a.role]).map((r) => opt(r, r, a.role)).join("") + "</select>" +
      assign +
      '<span class="due-cell"><input type="number" min="0" aria-label="Days" data-action="rule-act" data-k="dueDays" data-i="' + i + '" value="' + esc(a.dueDays) + '">' +
        '<select aria-label="Due date counted from" data-action="rule-act" data-k="dueFrom" data-i="' + i + '">' + opt("trigger", "days after it runs", a.dueFrom) + opt("project", "days before project due", a.dueFrom) + "</select></span>" +
      '<select aria-label="Stage" data-action="rule-act" data-k="stage" data-i="' + i + '">' + opt("", "Project's column", a.stage || "") + cols.map((c) => opt(c, c, a.stage)).join("") + "</select>" +
      '<button class="btn small ghost" title="Remove task" data-action="act-remove" data-i="' + i + '">×</button></div>';
  }).join("");
  return '<div style="border-top:1px solid var(--line)"><div class="panel-head" style="background:var(--accent-soft)"><h2>' + (S.autoEdit.isNew ? "New rule" : "Edit rule") + "</h2>" +
      '<span class="spacer"></span>' + (S.autoEdit.dirty ? '<span class="hint">Unsaved changes</span>' : "") +
      (S.autoEdit.isNew ? "" : '<button class="btn danger small" data-action="del-rule">Delete rule</button>') + '<button class="btn small" data-action="cancel-rule">Close</button><button class="btn primary small" data-action="save-rule">Save rule</button></div>' +
    when +
    '<div class="rule-when" style="padding-bottom:4px"><span class="eyebrow">Then add these tasks to the project</span></div>' +
    '<div class="arow arow-head"><span>Task</span><span>Role</span><span>Assign to</span><span>Due</span><span>Stage</span><span></span></div>' +
    rows +
    '<div class="addrow"><button class="btn small" data-action="act-add">Add another task</button><span class="hint">“Least busy” picks whoever in that role on this board has the fewest open tasks. A rule runs once per project for each column move or finished task, so moving a project back and forth won\'t add duplicates.</span></div></div>';
}

/* team */
function renderTeam() {
  const ms = sortedMembers();
  const head = '<div class="view-head"><h1>Team</h1><span class="sub">People who can be assigned tasks, and which boards they work on</span></div>';
  const rows = ms.map((m) => {
    const bs = m.boards || BOARDS;
    const open = Object.values(S.tasks).filter((t) => t.assigneeId === m.id && t.status !== "done").length;
    return '<div class="mrow"><div style="display:flex;gap:8px;align-items:center;min-width:0">' + avatar(m.id) + '<input type="text" aria-label="Name" style="flex:1;min-width:0" data-action="member-field" data-k="name" data-id="' + esc(m.id) + '" value="' + esc(m.name) + '"></div>' +
      '<select aria-label="Role" data-action="member-field" data-k="role" data-id="' + esc(m.id) + '">' + ALL_ROLES.map((r) => "<option" + (r === m.role ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>" +
      '<span class="checks">' + BOARDS.map((b) => '<label><input type="checkbox" data-action="member-board" data-id="' + esc(m.id) + '" data-board="' + b + '"' + (bs.includes(b) ? " checked" : "") + "> " + BOARD_NAME[b] + "</label>").join("") + "</span>" +
      '<span class="hint">' + open + " open</span>" +
      '<span style="display:flex;gap:6px">' + (m.id === S.me ? '<span class="tag">You</span>' : '<button class="btn small" data-action="this-is-me" data-id="' + esc(m.id) + '">This is me</button>') + '<button class="btn small danger" data-action="del-member" data-id="' + esc(m.id) + '">Remove</button></span></div>';
  }).join("");
  return head + '<div class="panel"><div class="panel-head"><h2>People</h2><span class="hint">' + ms.length + "</span></div>" +
    (rows || '<div class="empty"><strong>No one on the team yet</strong>Add people below, then pick yourself in "Viewing as".</div>') +
    '<form class="addrow" data-form="add-member"><input type="text" id="new-member-name" placeholder="Full name" required>' +
      '<select id="new-member-role" aria-label="Role">' + ALL_ROLES.map((r) => "<option>" + esc(r) + "</option>").join("") + "</select>" +
      '<button class="btn primary small" type="submit">Add person</button></form></div>';
}

/* modals */
function renderModal() {
  const m = S.modal;
  if (!m) return "";
  if (m.type === "new-project") return renderNewProject(m.board);
  if (m.type === "project") { const p = S.projects[m.id]; return p ? renderProject(p) : ""; }
  return "";
}

function renderNewProject(b) {
  const tpls = Object.values(S.templates).filter((t) => t.board === b);
  const cols = columnsFor(b);
  return '<div class="overlay" data-action="close-modal-bg"><form class="modal narrow" data-form="new-project" data-board="' + b + '" role="dialog" aria-label="New project">' +
    '<div class="modal-head"><div class="grow"><span class="eyebrow">' + BOARD_NAME[b] + "</span><h2>New project</h2></div></div>" +
    '<div class="form-grid">' +
      '<label class="field">Project name<input type="text" id="np-name" required placeholder="e.g. Line 4 conveyor retrofit"></label>' +
      '<div class="two"><label class="field">Customer<input type="text" id="np-client" placeholder="Customer name"></label>' +
      '<label class="field">Project number<input type="text" id="np-number" placeholder="e.g. P-1089"></label></div>' +
      '<div class="two"><label class="field">' + (b === "pre" ? "Target close date" : "Project due date") + '<input type="date" id="np-due"></label>' +
      '<label class="field">Starting column<select id="np-col">' + cols.map((c) => "<option>" + esc(c) + "</option>").join("") + "</select></label></div>" +
      '<label class="field">Pathway template<select id="np-tpl"><option value="">Blank, no tasks</option>' + tpls.map((t, i) => '<option value="' + esc(t.id) + '"' + (i === 0 ? " selected" : "") + ">" + esc(t.name) + " (" + (t.steps || []).length + " tasks)</option>").join("") + "</select></label>" +
      '<p class="hint" style="margin:0">Task due dates are counted back from the project due date using each step\'s lead time. You can change any of them afterwards.</p>' +
    "</div>" +
    '<div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Create project</button></div>' +
  "</form></div>";
}

function renderProject(p) {
  const cols = columnsFor(p.board);
  const ts = tasksOf(p.id);
  const stages = cols.slice();
  ts.forEach((t) => { if (t.stage && !stages.includes(t.stage)) stages.push(t.stage); });
  const members = sortedMembers().filter((m) => (m.boards || BOARDS).includes(p.board));
  const roles = ROLES[p.board];
  const done = ts.filter((t) => t.status === "done").length;
  const stageHtml = stages.map((stage) => {
    const st = ts.filter((t) => (t.stage || cols[0]) === stage);
    if (!st.length) return "";
    return '<section class="stage"><div class="stage-head' + (stage === p.column ? " current" : "") + '"><h3>' + esc(stage) + '</h3><span class="due">' + st.filter((t) => t.status === "done").length + "/" + st.length + "</span></div>" +
      st.map((t) => taskEditRow(t, ts, members, roles)).join("") + "</section>";
  }).join("");
  return '<div class="overlay" data-action="close-modal-bg"><div class="modal" role="dialog" aria-label="' + esc(p.name) + '">' +
    '<div class="modal-head"><div class="grow"><span class="eyebrow">' + BOARD_NAME[p.board] + " · " + done + " of " + ts.length + ' tasks done</span>' +
      '<input class="name" type="text" aria-label="Project name" data-action="project-field" data-k="name" value="' + esc(p.name) + '">' +
      '<div class="fields">' +
        '<label class="field">Customer<input type="text" data-action="project-field" data-k="client" value="' + esc(p.client || "") + '"></label>' +
        '<label class="field">Project #<input type="text" style="width:110px" data-action="project-field" data-k="number" value="' + esc(p.number || "") + '"></label>' +
        '<label class="field">Column<select data-action="project-field" data-k="column">' + cols.map((c) => "<option" + (c === p.column ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select></label>" +
        '<label class="field">' + (p.board === "pre" ? "Target close" : "Due date") + '<input type="date" data-action="project-field" data-k="due" value="' + esc(p.due || "") + '"></label>' +
        (p.board === "pre" ? '<button class="btn small" data-action="handoff" title="Create a post sales project for this customer">Hand off to post sales</button>' : "") +
      "</div></div>" +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' + (S.host === "claude" ? '<button class="btn small" data-action="zoom-open">Find tasks in Zoom chat</button>' : "") + '<button class="btn small danger" data-action="archive-project">Archive</button><button class="btn small" data-action="close-modal">Close</button></div></div>' +
    '<div class="modal-body" data-keep-scroll="modal">' +
      renderZoom(p) +
      (stageHtml || '<div class="empty"><strong>No tasks yet</strong>Add the first one below.</div>') +
      '<form class="stage addrow" data-form="add-task" style="border-style:dashed">' +
        '<input type="text" id="nt-title" placeholder="Add a task" required>' +
        '<select id="nt-stage" aria-label="Stage">' + cols.map((c) => "<option" + (c === p.column ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select>" +
        '<select id="nt-role" aria-label="Role">' + roles.map((r) => "<option>" + esc(r) + "</option>").join("") + "</select>" +
        '<input type="date" id="nt-due" aria-label="Due date">' +
        '<button class="btn primary small" type="submit">Add task</button></form>' +
    "</div></div></div>";
}

function taskEditRow(t, all, members, roles) {
  const st = t.status || "todo";
  const deps = openDeps(t);
  const lateDeps = deps.filter(() => t.due && daysFromToday(t.due) <= WEEK_DAYS);
  const others = all.filter((o) => o.id !== t.id);
  const sortedMs = members.slice().sort((a, b) => (b.role === t.role) - (a.role === t.role) || a.name.localeCompare(b.name));
  const assigneeOpts = '<option value="">Unassigned</option>' + sortedMs.map((m) => '<option value="' + esc(m.id) + '"' + (m.id === t.assigneeId ? " selected" : "") + ">" + esc(m.name) + (m.role !== t.role ? " · " + esc(m.role) : "") + "</option>").join("") +
    (t.assigneeId && !sortedMs.find((m) => m.id === t.assigneeId) ? '<option value="' + esc(t.assigneeId) + '" selected>' + esc(memberName(t.assigneeId)) + "</option>" : "");
  const depCount = (t.dependsOn || []).length;
  return '<div class="trow">' +
    '<button class="status-btn ' + st + '" data-action="cycle-status" data-id="' + esc(t.id) + '"><i class="glyph ' + (st === "todo" && deps.length ? "blocked" : st) + '"></i>' + STATUS_LABEL[st] + "</button>" +
    '<div class="title-cell"><input type="text" aria-label="Task" data-action="task-field" data-k="title" data-id="' + esc(t.id) + '" value="' + esc(t.title) + '"></div>' +
    '<select aria-label="Role" data-action="task-field" data-k="role" data-id="' + esc(t.id) + '">' + roles.concat(roles.includes(t.role) ? [] : [t.role || ""]).map((r) => "<option" + (r === t.role ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>" +

      (others.length ? others.map((o) => '<label><input type="checkbox" data-action="task-dep" data-id="' + esc(t.id) + '" data-dep="' + esc(o.id) + '"' + ((t.dependsOn || []).includes(o.id) ? " checked" : "") + "> " + esc(o.title) + "</label>").join("") : '<span class="hint">No other tasks</span>') +
      "</div></details>" +
