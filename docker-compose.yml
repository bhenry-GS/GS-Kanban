# Runs the board behind Caddy, which gets and renews the HTTPS certificate.
# On the server: put DOMAIN (and any D-Tools keys) in .env, then `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"      # Caddy ends HTTPS in front of the app
    volumes:
      - kanban-data:/data   # the SQLite database
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  kanban-data:
  caddy-data:
  caddy-config:
